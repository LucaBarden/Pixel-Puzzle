name: Publish release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip and validate the 'release/' prefix (e.g. release/0.2.1 -> 0.2.1)
          VERSION="${TAG#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.post[0-9]+)?$ ]]; then
            echo "Invalid version from tag: $TAG (expected release/x.y.z)"
            exit 1
          fi
          echo "Setting project version to $VERSION"
          uv version "$VERSION"

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish

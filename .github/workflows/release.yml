name: Publish release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip and validate the 'release/' prefix (e.g. release/0.2.1 -> 0.2.1)
          VERSION="${TAG#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.post[0-9]+)?$ ]]; then
            echo "Invalid version from tag: $TAG (expected release/x.y.z)"
            exit 1
          fi
          echo "Setting project version to $VERSION"
          uv version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet pyproject.toml; then
            echo "pyproject.toml already at ${{ steps.version.outputs.version }}, nothing to commit."
          else
            git add pyproject.toml
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"

            # Find the branch whose tip is the parent of this tag (i.e. where the tag was cut from).
            # git for-each-ref on the *parent* commit (before our bump commit) is reliable
            # because that commit IS reachable from the remote branch.
            PARENT=$(git rev-parse HEAD~1)
            git fetch origin '+refs/heads/*:refs/remotes/origin/*'
            BRANCH=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ \
              | grep -v '\->' \
              | while read ref; do
                  if git merge-base --is-ancestor "$PARENT" "origin/${ref#origin/}" 2>/dev/null \
                     && git merge-base --is-ancestor "origin/${ref#origin/}" "$PARENT" 2>/dev/null; then
                    echo "${ref#origin/}"
                    break
                  fi
                done)

            if [[ -z "$BRANCH" ]]; then
              echo "Could not determine source branch; defaulting to main."
              BRANCH="main"
            fi

            echo "Pushing version bump to origin/$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish

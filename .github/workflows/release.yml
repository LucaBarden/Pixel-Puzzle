name: Publish release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip and validate the 'release/' prefix (e.g. release/0.2.1 -> 0.2.1)
          VERSION="${TAG#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.post[0-9]+)?$ ]]; then
            echo "Invalid version from tag: $TAG (expected release/x.y.z)"
            exit 1
          fi
          echo "Setting project version to $VERSION"
          uv version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # If pyproject.toml changed relative to the tag, commit it back.
          if git diff --quiet pyproject.toml; then
            echo "pyproject.toml already at ${{ steps.version.outputs.version }}, nothing to commit."
          else
            git add pyproject.toml
            # [skip ci] prevents the commit from triggering this workflow again.
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"

            # Fetch all remote branches and tags so branch detection can resolve.
            git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

            BRANCH=$(git for-each-ref --contains=HEAD --format='%(refname:short)' refs/remotes/origin/ \
              | grep -v '\->' \
              | head -n1 \
              | sed 's|origin/||')

            if [[ -z "$BRANCH" ]]; then
              echo "Could not determine a remote branch containing this checkout."
              exit 1
            fi

            echo "Pushing version bump to origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Quiz</title>
    <!-- Premium Google Fonts: Outfit & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
    
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="glass-card">
            <h1 class="title">Pixel Quiz</h1>
            <p class="subtitle">Erstelle deine eigene Quiz-Runde! Lade Bilder für deine Session hoch.</p>
            
            <!-- Drag & Drop Zone -->
            <div id="drop-zone" class="drop-zone">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p class="drop-text">Bilder hierher ziehen oder <span class="browse-link">durchsuchen</span></p>
                <input type="file" id="file-input" multiple accept="image/*" class="hidden-input">
            </div>

            <!-- Preview List -->
            <div id="preview-container" class="preview-container hidden">
                <h3 class="preview-title">Ausgewählte Bilder (<span id="file-count">0</span>)</h3>
                <div id="preview-list" class="preview-list"></div>
            </div>

            <!-- Buttons -->
            <div class="action-buttons">
                <button id="start-btn" class="btn btn-primary" disabled>Spiel starten</button>
                <button id="default-btn" class="btn btn-secondary">Mit Standard-Bildern spielen</button>
            </div>
        </div>
    
        <!-- Main Game Card -->
        <div id="card" class="glass-card hidden">

            <h1 class="title">Pixel Quiz</h1>

            <!-- Canvas Container -->
            <div class="canvas-wrapper">
                <canvas id="canvas" class="canvas"></canvas>
            </div>

            <!-- Score + Status -->
            <div class="stats-row">
                <div id="score" class="score-badge">
                    Score: 1000
                </div>

                <div id="status" class="status-badge">
                    Bereit
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-guide">
                <span class="key-badge">SPACE</span> Start / Pause
                <span class="separator">|</span>
                <span class="key-badge">N</span> Nächstes Bild
            </div>

        </div>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
